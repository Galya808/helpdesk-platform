services:
  - type: web
    name: helpdesk-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HELPDESK_ENVIRONMENT
        value: production
      - key: HELPDESK_DEBUG
        value: "false"
      - key: HELPDESK_LOG_LEVEL
        value: INFO
      - key: HELPDESK_LOG_FORMAT
        value: json
      - key: HELPDESK_DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: HELPDESK_JWT_SECRET_KEY
        generateValue: true

databases:
  - name: helpdesk-db
    databaseName: helpdesk
    user: helpdesk
    plan: free
    region: frankfurt
    ipAllowList: []
