services:
  api:
    build:
      context: ./backend
    container_name: helpdesk-api
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      HELPDESK_DATABASE_URL: postgresql+asyncpg://helpdesk:helpdesk_password@db:5432/helpdesk

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:18.3-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
